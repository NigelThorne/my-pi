# Tiled Pi sessions. Zellij configuration remains independent.
set -g mouse on
set -g history-limit 10000

# Preserve modified Enter keys for Pi in Ghostty.
set -g extended-keys on
set -g extended-keys-format csi-u

# Show agent names without renaming sessions used for routing.
set -g pane-border-status top
set -g pane-border-format '#{pane_title}'

# Mouse selection copies immediately to the macOS clipboard on release.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
