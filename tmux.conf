# Tiled Pi sessions. Zellij configuration remains independent.
set -g mouse on
set -g history-limit 10000

# Preserve modified Enter keys for Pi in Ghostty.
set -g extended-keys on
set -g extended-keys-format csi-u

# Show agent names without renaming sessions used for routing.
set -g pane-border-status top
set -g pane-border-format '#{pane_title}'

# Mouse selection copies immediately to the macOS clipboard on release.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# Outer terminal (Ghostty) title follows pi's own title: when the window has a
# single pane use that pane's title (pi sets it to "π - <session name> - <dir>"),
# otherwise "session:window". Without this the Ghostty title stays at whatever
# was printed before tmux started (e.g. the "Pi Route <id>" probe).
set -g set-titles on
set -g set-titles-string '#{?#{==:#{window_panes},1},#{pane_title},#S:#W}'
